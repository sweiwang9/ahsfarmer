name: Alice Hamilton Farmer
tagline: Law Professor · Adviser · Writer
themes: Climate displacement · Coastal communities · Refugee protection ·
description: Alice Hamilton Farmer is an international lawyer working on refugee
  law, forced displacement, and climate mobility.
about:
  - >
    Alice Hamilton Farmer is an Associate Professor of Law at the University of
    Maine and a Senior Adviser for Climate Rights International. For twenty
    years she has worked on refugee protection and the rights of people in
    displacement — in refugee camps, detention centres and courtrooms.
  - >
    For over a decade she was a lawyer with UNHCR, the UN Refugee Agency,
    latterly as head of its United States legal team, where she represented the
    agency before the US Supreme Court and the federal courts of appeals and
    served as its focal point for climate change.
  - >
    Her current research asks how climate change is reshaping the legal
    framework of forced displacement, with a focus on small-scale fishing
    communities and other coastal populations living with slow-onset loss.
currently: >
  Currently writing on climate displacement and building a climate change law
  lab.
