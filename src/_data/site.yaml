# Site-wide settings. Edit the tagline, themes and bio here.
name: "Alice Hamilton Farmer"
tagline: "Refugee Lawyer · Researcher · Writer"
description: "Alice Hamilton Farmer is an international lawyer working on refugee law, forced displacement and climate mobility."

# The line under the name on the home page. Keep the middle dots.
themes: "Climate displacement · Coastal communities · Refugee protection ·"

# Home page biography. Each item is one paragraph.
about:
  - >
    Alice Hamilton Farmer is an international lawyer. For twenty years she has worked on
    refugee protection and the rights of people in displacement — in refugee camps,
    detention centres and courtrooms.
  - >
    Until January 2024 she was head of the United States legal team for UNHCR, the UN
    Refugee Agency, where she represented the agency before the US Supreme Court and the
    federal courts of appeals, and served as its focal point for climate change.
  - >
    Her current research asks how climate change is reshaping the legal framework of
    forced displacement, with a focus on small-scale fishing communities and other coastal
    populations living with slow-onset loss.

# One line, updated occasionally. Shown at the bottom of the home page.
currently: >
  Currently a Fellow at the Center for Advanced Study in the Behavioral Sciences at
  Stanford, and building a proof of concept for a climate change law lab.

