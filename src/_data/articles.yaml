- title: "Disasters in Slow Motion: Why Climate Displacement Tests International Legal Frameworks, and What to Do About It"
  year: 2026
  venue: "47 University of Pennsylvania Journal of International Law 4"
  url: "https://www.pennlawjil.com/volume47issue4"
  pdf: "https://www.pennlawjil.com/s/2-Author-Approved_Farmer-Formatted-UPDATED.pdf"
  image: "penn-jil-2026.jpg"
  featured: true
  note: "Reconceives climate displacement as a long problem rather than a short-term emergency, through two case studies: small-scale fishing communities in the global south, and residential property in the United States."

- title: "The Discretion Loophole: Executive Power, International Refugee Law, and the Erosion of Asylum Protections in the United States"
  year: 2025
  venue: "36 Stanford Law & Policy Review 1"
  url: "https://law.stanford.edu/publications/the-discretion-loophole-executive-power-international-refugee-law-and-the-erosion-of-asylum-protections-in-the-united-states/"
